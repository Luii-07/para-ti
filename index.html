<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fondo animado -->
    <div class="noche">
        <div class="estrellas"></div>
        <div class="estrellas2"></div>
        <div class="estrellas3"></div>
    </div>
    <div id="seccionAcertijo" class="contenedor">
        <h2>Solo una pregunta...</h2>
        <p>Si pudieras detener el tiempo en un solo recuerdo, ¿cuál sería?</p>
        <textarea id="respuestaInput" placeholder="Escribe tu respuesta aquí..."></textarea>
        <button onclick="enviarRespuesta()">Enviar</button>
    </div>

    <div id="seccionMensaje" class="contenedor" style="display: none;">
        <h2>Porque todo de mí, ama todo de ti</h2>
        <p>Tu respuesta fue perfecta. Eres exactamente lo que estaba buscando, incluso a la distancia.</p>
    </div>

    <audio id="cancionFondo" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
